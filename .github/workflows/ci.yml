name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integ
          POSTGRES_PASSWORD: integ
          POSTGRES_DB: integ_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U integ" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://integ:integ@localhost:5432/integ_test
      PGPASSWORD: integ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Migrations (through the real psycopg runner)
        run: python -m integration.migrate
      - name: Migrations are idempotent
        run: python -m integration.migrate
      - name: Database checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/check_db.sql
      - name: Seed templates
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed_task_templates.sql
